<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Estudiante - Monsters University</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-container">
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="dashboard-sidebar">
            <!-- SECCIÓN DE PERFIL -->
            <div class="sidebar-profile">
                <img src="IMG/1x/FOTO PERFIL.png" alt="Foto de perfil Mike Wazowski" class="profile-avatar">
                <h2 class="profile-name">Mike Wazowski</h2>
                <span class="profile-role">Estudiante</span>
            </div>

            <!-- NAVEGACIÓN -->
            <nav class="sidebar-menu">
                <a href="#" class="sidebar-link active">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>Inicio</span>
                </a>

                <a href="#" class="sidebar-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Horario</span>
                </a>

                <a href="#" class="sidebar-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        <line x1="8" y1="6" x2="16" y2="6"></line>
                        <line x1="8" y1="10" x2="14" y2="10"></line>
                    </svg>
                    <span>Materias</span>
                </a>

                <a href="#" class="sidebar-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                    </svg>
                    <span>Matricula</span>
                </a>

                <a href="#" class="sidebar-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>Ajustes</span>
                </a>
            </nav>

            <!-- BOTÓN DE SALIDA (REDIRIGE A LOGIN.HTML) -->
            <div class="sidebar-footer">
                <a href="login.html" class="logout-link" title="Cerrar sesión">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H12"></path>
                        <polyline points="8 16 4 12 8 8"></polyline>
                        <line x1="4" y1="12" x2="16" y2="12"></line>
                    </svg>
                    <span>Salir</span>
                </a>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="dashboard-main">
            <!-- ENCABEZADO CON LOGO MU EN LA ESQUINA SUPERIOR DERECHA -->
            <header class="dashboard-header">
                <img src="IMG/1x/LOGO DB.png" alt="Logo Monsters University" class="main-logo-mu">
            </header>

            <!-- ESPACIO DE TRABAJO DEL DASHBOARD -->
            <section class="dashboard-content">
                <div class="welcome-banner">
                    <h1>¡Bienvenido de vuelta, Mike!</h1>
                    <p>Facultad de Sustos | Semestre Académico 2026-II</p>
                </div>

                <!-- TARJETAS RÁPIDAS DE RESUMEN -->
                <div class="dashboard-cards-grid">
                    <div class="dash-card">
                        <div class="card-header-icon">📚</div>
                        <div class="card-info">
                            <h3>Materias Inscritas</h3>
                            <p class="card-highlight">5 Cursos</p>
                        </div>
                    </div>

                    <div class="dash-card">
                        <div class="card-header-icon">⭐</div>
                        <div class="card-info">
                            <h3>Promedio de Sustos</h3>
                            <p class="card-highlight">9.8 / 10</p>
                        </div>
                    </div>

                    <div class="dash-card">
                        <div class="card-header-icon">⏰</div>
                        <div class="card-info">
                            <h3>Próxima Clase</h3>
                            <p class="card-highlight">Rugido Teórico</p>
                            <span class="card-subtext">Hoy a las 10:00 AM</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
